        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">

            class="border p-3 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-gray-500 transition"
          ></textarea>

          <button
            class="bg-gradient-to-r from-gray-700 to-gray-900 text-white p-3 rounded-xl shadow-lg 
            hover:from-gray-800 hover:to-black hover:shadow-2xl hover:-translate-y-1
